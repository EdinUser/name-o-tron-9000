name: Build & Deploy Docs (MkDocs)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure deployment SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_NEW_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_NEW_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Fetch latest release.json from VPS (if present)
        env:
          VPS_HOST: ${{ secrets.VPS_NEW_HOST }}
          VPS_USER: ${{ secrets.VPS_NEW_USER }}
        shell: bash
        run: |
          set -euo pipefail
          if ssh -i ~/.ssh/vps_key -p 22 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" test -f /var/www/name-o-tron.kirilov.dev/web/release.json; then
            scp -P 22 -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST":/var/www/name-o-tron.kirilov.dev/web/release.json ./release.json
          else
            echo "{}" > release.json
          fi

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build MkDocs site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --clean --site-dir site

      - name: Sync site to VPS (preserve downloads & release.json)
        env:
          VPS_HOST: ${{ secrets.VPS_NEW_HOST }}
          VPS_USER: ${{ secrets.VPS_NEW_USER }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete --chmod=D755,F644 \
            --exclude 'downloads/' \
            --exclude 'release.json' \
            --exclude 'community/' \
            --exclude '/[0-9]*.[0-9]*.[0-9]*/' \
            --exclude '/stats/' \
            --exclude '/error/' \
            --exclude '/.ht*' \
            -e "ssh -i ~/.ssh/vps_key -p 22 -o StrictHostKeyChecking=yes" \
            site/ "$VPS_USER@$VPS_HOST":/var/www/name-o-tron.kirilov.dev/web/
